name: Spacecraft evidence acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spacecraft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y gcc clang clang-tidy cppcheck
      - run: python -m pip install -e '.[syntax,hardware,constraints]' codechecker==6.29.1 pytest
      - run: python -m pytest tests/test_spacecraft_suite.py tests/test_spacecraft_instance_gaps.py tests/test_business_contracts.py tests/test_constraints_translation_unit.py -q
      - run: python examples/business_contracts/verify_pairs.py --output ecdet_reports/business-pairs
      - run: python scripts/verify_spacecraft_suite.py --output ecdet_reports/spacecraft-suite --constraints
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spacecraft-evidence
          path: ecdet_reports/
