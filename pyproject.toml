[project]
name = "ecdet"
version = "1.2.0"
description = "嵌入式软件代码缺陷与安全漏洞检测系统（Embedded Code Defect & Security Detection Toolkit）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ecdet 项目组" }]
keywords = ["embedded", "static-analysis", "misra", "cert-c", "gjb", "sarif", "cwe"]
# CodeChecker 是 L3 静态分析主引擎；SARIF 与其余分析逻辑由 ecdet 统一编排。
dependencies = ["codechecker>=6.29,<7"]

[project.optional-dependencies]
hardware = ["cmsis-svd==0.6"]
syntax = ["tree-sitter==0.26.0", "tree-sitter-c==0.24.2"]
constraints = ["z3-solver==5.3.3.0", "tree-sitter==0.26.0", "tree-sitter-c==0.24.2"]

[project.scripts]
ecdet = "ecdet.cli:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "pytest>=8.0",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecdet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
